<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🧪 Test Final - AbsoluteOrientation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { color: #f0c040; text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        .status-box {
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .success { background: rgba(76, 175, 80, 0.3); color: #4caf50; }
        .error { background: rgba(255, 68, 68, 0.3); color: #ff4444; }
        .warning { background: rgba(255, 170, 0, 0.3); color: #ffaa00; }
        .info { background: rgba(136, 204, 255, 0.2); color: #88ccff; }
        
        .big-heading {
            text-align: center;
            padding: 30px;
            background: rgba(240, 192, 64, 0.1);
            border-radius: 15px;
            border: 2px solid rgba(240, 192, 64, 0.3);
            margin: 15px 0;
        }
        .big-heading .degrees {
            font-size: 4rem;
            font-weight: bold;
            color: #f0c040;
        }
        .big-heading .direction {
            font-size: 2rem;
            color: #88ccff;
        }
        
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .sensor-card {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .sensor-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }
        .sensor-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f0c040;
            margin-top: 3px;
        }
        
        button {
            width: 100%;
            background: #f0c040;
            color: #1a1a2e;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 5px 0;
        }
        button:active { transform: scale(0.95); }
        button.secondary { background: #444; color: white; }
        
        .log-area {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 0.7rem;
            color: #666;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
        }
        .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Sensores</h1>
        
        <div id="status" class="status-box info">🔄 Iniciando...</div>
        
        <div class="big-heading">
            <div>🧭 Rumbo</div>
            <div class="degrees" id="heading">---°</div>
            <div class="direction" id="direction">---</div>
        </div>
        
        <div class="sensor-grid">
            <div class="sensor-card">
                <div class="sensor-label">Sensor</div>
                <div class="sensor-value" id="sensorType" style="color:#88ccff;font-size:0.8rem;">---</div>
            </div>
            <div class="sensor-card">
                <div class="sensor-label">Estado</div>
                <div class="sensor-value" id="sensorStatus" style="color:#88ccff;font-size:0.8rem;">---</div>
            </div>
        </div>
        
        <button onclick="testAll()">📱 Probar Todos los Sensores</button>
        <button onclick="window.location.reload()" class="secondary">🔄 Recargar</button>
        
        <div id="log" class="log-area"></div>
    </div>

    <script>
        let logElement = document.getElementById('log');
        let statusElement = document.getElementById('status');
        let headingEl = document.getElementById('heading');
        let directionEl = document.getElementById('direction');
        let sensorTypeEl = document.getElementById('sensorType');
        let sensorStatusEl = document.getElementById('sensorStatus');
        
        let testRunning = false;
        let heading = 0;
        
        function addLog(msg) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logElement.appendChild(entry);
            logElement.scrollTop = logElement.scrollHeight;
            console.log(msg);
        }
        
        function setStatus(msg, type = 'info') {
            statusElement.textContent = msg;
            statusElement.className = `status-box ${type}`;
        }
        
        function getDirection(deg) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return dirs[Math.round(deg / 45) % 8];
        }
        
        function updateDisplay(deg) {
            heading = deg;
            headingEl.textContent = Math.round(deg) + '°';
            directionEl.textContent = getDirection(deg);
        }
        
        function quaternionToHeading(q) {
            const x = q[0], y = q[1], z = q[2], w = q[3];
            const siny = 2 * (w * z + x * y);
            const cosy = 1 - 2 * (y * y + z * z);
            let heading = Math.atan2(siny, cosy) * (180 / Math.PI);
            heading = (heading + 360) % 360;
            return heading;
        }
        
        // ============================================
        // TEST: ABSOLUTE ORIENTATION SENSOR
        // ============================================
        function testAbsoluteOrientation() {
            return new Promise((resolve) => {
                if (!window.AbsoluteOrientationSensor) {
                    addLog('❌ AbsoluteOrientationSensor no disponible');
                    resolve(false);
                    return;
                }
                
                addLog('📱 Probando AbsoluteOrientationSensor...');
                sensorTypeEl.textContent = 'AbsoluteOrientation';
                sensorStatusEl.textContent = '🔄 Conectando...';
                
                try {
                    const sensor = new AbsoluteOrientationSensor({ frequency: 60 });
                    
                    let resolved = false;
                    
                    sensor.addEventListener('reading', () => {
                        if (!resolved) {
                            resolved = true;
                            let deg = null;
                            
                            if (sensor.quaternion) {
                                deg = quaternionToHeading(sensor.quaternion);
                            } else if (sensor.rotationMatrix) {
                                const m = sensor.rotationMatrix;
                                deg = Math.atan2(m[4], m[0]) * (180 / Math.PI);
                                deg = (deg + 360) % 360;
                            }
                            
                            if (deg !== null && !isNaN(deg)) {
                                addLog(`✅ AbsoluteOrientation: ${Math.round(deg)}°`);
                                setStatus('✅ ¡Funciona!', 'success');
                                updateDisplay(deg);
                                sensorTypeEl.textContent = 'AbsoluteOrientation ✅';
                                sensorStatusEl.textContent = 'Funcionando';
                                sensor.stop();
                                resolve(true);
                            }
                        }
                    });
                    
                    sensor.addEventListener('error', (e) => {
                        if (!resolved) {
                            resolved = true;
                            addLog('❌ Error: ' + (e.error?.message || 'desconocido'));
                            sensorTypeEl.textContent = 'AbsoluteOrientation ❌';
                            sensorStatusEl.textContent = 'Error';
                            resolve(false);
                        }
                    });
                    
                    sensor.start();
                    
                    setTimeout(() => {
                        if (!resolved) {
                            resolved = true;
                            addLog('⏳ Timeout - sin datos');
                            sensorTypeEl.textContent = 'AbsoluteOrientation ⏳';
                            sensorStatusEl.textContent = 'Timeout';
                            sensor.stop();
                            resolve(false);
                        }
                    }, 4000);
                    
                } catch (e) {
                    addLog('❌ Error: ' + e.message);
                    resolve(false);
                }
            });
        }
        
        // ============================================
        // TEST: MAGNETOMETER
        // ============================================
        function testMagnetometer() {
            return new Promise((resolve) => {
                if (!window.Magnetometer) {
                    addLog('❌ Magnetometer no disponible');
                    resolve(false);
                    return;
                }
                
                addLog('🧲 Probando Magnetometer...');
                sensorTypeEl.textContent = 'Magnetometer';
                sensorStatusEl.textContent = '🔄 Conectando...';
                
                try {
                    const sensor = new Magnetometer({ frequency: 60 });
                    let resolved = false;
                    
                    sensor.addEventListener('reading', () => {
                        if (!resolved) {
                            resolved = true;
                            const x = sensor.x, y = sensor.y;
                            
                            if (x !== null && y !== null && !isNaN(x) && !isNaN(y)) {
                                let deg = Math.atan2(y, x) * (180 / Math.PI);
                                deg = (deg + 360) % 360;
                                deg = (deg + 90) % 360;
                                
                                addLog(`✅ Magnetometer: ${Math.round(deg)}°`);
                                setStatus('✅ ¡Funciona!', 'success');
                                updateDisplay(deg);
                                sensorTypeEl.textContent = 'Magnetometer ✅';
                                sensorStatusEl.textContent = 'Funcionando';
                                sensor.stop();
                                resolve(true);
                            }
                        }
                    });
                    
                    sensor.addEventListener('error', (e) => {
                        if (!resolved) {
                            resolved = true;
                            addLog('❌ Error Magnetometer');
                            sensorTypeEl.textContent = 'Magnetometer ❌';
                            sensorStatusEl.textContent = 'Error';
                            resolve(false);
                        }
                    });
                    
                    sensor.start();
                    
                    setTimeout(() => {
                        if (!resolved) {
                            resolved = true;
                            addLog('⏳ Timeout Magnetometer');
                            sensorTypeEl.textContent = 'Magnetometer ⏳';
                            sensorStatusEl.textContent = 'Timeout';
                            sensor.stop();
                            resolve(false);
                        }
                    }, 4000);
                    
                } catch (e) {
                    addLog('❌ Error: ' + e.message);
                    resolve(false);
                }
            });
        }
        
        // ============================================
        // TEST: DEVICE ORIENTATION
        // ============================================
        function testDeviceOrientation() {
            return new Promise((resolve) => {
                if (typeof DeviceOrientationEvent === 'undefined') {
                    addLog('❌ DeviceOrientation no disponible');
                    resolve(false);
                    return;
                }
                
                addLog('📱 Probando DeviceOrientation...');
                sensorTypeEl.textContent = 'DeviceOrientation';
                sensorStatusEl.textContent = '🔄 Conectando...';
                
                let resolved = false;
                let handler = null;
                
                const checkEvent = (e) => {
                    let deg = null;
                    
                    if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
                        deg = e.webkitCompassHeading;
                    } else if (e.alpha !== undefined && e.alpha !== null && !isNaN(e.alpha)) {
                        deg = e.alpha;
                    }
                    
                    if (deg !== null && !isNaN(deg)) {
                        if (!resolved) {
                            resolved = true;
                            addLog(`✅ DeviceOrientation: ${Math.round(deg)}°`);
                            setStatus('✅ ¡Funciona!', 'success');
                            updateDisplay(deg);
                            sensorTypeEl.textContent = 'DeviceOrientation ✅';
                            sensorStatusEl.textContent = 'Funcionando';
                            window.removeEventListener('deviceorientation', handler);
                            resolve(true);
                        }
                    }
                };
                
                handler = checkEvent;
                
                // iOS necesita permiso
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handler, true);
                            } else {
                                resolved = true;
                                addLog('❌ Permiso denegado');
                                sensorTypeEl.textContent = 'DeviceOrientation ❌';
                                sensorStatusEl.textContent = 'Permiso denegado';
                                resolve(false);
                            }
                        });
                } else {
                    window.addEventListener('deviceorientation', handler, true);
                }
                
                setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        addLog('⏳ Timeout DeviceOrientation');
                        sensorTypeEl.textContent = 'DeviceOrientation ⏳';
                        sensorStatusEl.textContent = 'Timeout';
                        window.removeEventListener('deviceorientation', handler);
                        resolve(false);
                    }
                }, 4000);
            });
        }
        
        // ============================================
        // PROBAR TODOS
        // ============================================
        async function testAll() {
            if (testRunning) return;
            testRunning = true;
            
            addLog('🚀 Iniciando pruebas...');
            setStatus('🔄 Probando sensores...', 'info');
            
            // Reset
            headingEl.textContent = '---°';
            directionEl.textContent = '---';
            
            // Probar en orden
            const tests = [
                { name: 'AbsoluteOrientation', fn: testAbsoluteOrientation },
                { name: 'Magnetometer', fn: testMagnetometer },
                { name: 'DeviceOrientation', fn: testDeviceOrientation }
            ];
            
            for (const test of tests) {
                addLog(`🔍 Probando ${test.name}...`);
                const result = await test.fn();
                if (result) {
                    addLog(`✅ ${test.name} funciona!`);
                    testRunning = false;
                    return;
                }
                addLog(`❌ ${test.name} no funciona`);
            }
            
            addLog('❌ Ningún sensor funciona');
            setStatus('❌ No se detectaron sensores', 'error');
            sensorTypeEl.textContent = '❌ Ninguno';
            sensorStatusEl.textContent = 'No disponible';
            testRunning = false;
        }
        
        // ============================================
        // INICIAR AUTOMÁTICAMENTE
        // ============================================
        addLog('🚀 Iniciando test automático...');
        setTimeout(testAll, 1000);
    </script>
</body>
</html>

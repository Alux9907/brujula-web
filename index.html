<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🧭 Brújula Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🧭 Brújula</h1>
        <div class="compass-container">
            <div class="compass">
                <!-- La aguja -->
                <div class="needle" id="needle"></div>
                <!-- Centro de la brújula -->
                <div class="center-dot"></div>
                <!-- Marcas de dirección -->
                <div class="mark mark-n">N</div>
                <div class="mark mark-e">E</div>
                <div class="mark mark-s">S</div>
                <div class="mark mark-o">O</div>
            </div>
        </div>
        <div class="info">
            <p>Rumbo: <span id="heading">---</span>°</p>
            <p id="status">Esperando permiso...</p>
        </div>
        <button id="calibrate-btn">🔄 Calibrar</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
